name: OQUPIE 티켓 동기화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: scripts 폴더 확인
        run: mkdir -p scripts

      - name: 패키지 설치
        working-directory: scripts
        run: npm install

      - name: Puppeteer 브라우저 설치
        working-directory: scripts
        run: npx puppeteer browsers install chrome

      - name: OQUPIE 동기화 실행
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync_oqupie.js
